name: ShelfFlow CI

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test
        env:
          POSTGRES_PASSWORD: shelfflow_ci_only
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode clean verify

    services:
      postgres:
        image: postgres:18.7-alpine3.24
        env:
          POSTGRES_DB: shelfflow
          POSTGRES_USER: shelfflow
          POSTGRES_PASSWORD: shelfflow_ci_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U shelfflow -d shelfflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
